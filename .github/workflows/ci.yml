name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/jcardzz/coworking-booking-service
  APP_URL: https://coworking-booking-service-ujuk.onrender.com/coworking-service

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

  publish:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            GIT_SHA=${{ github.sha }}

  scan:
    needs: publish
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          # only fail on issues that already have a fix we can apply
          ignore-unfixed: true
          exit-code: '1'

      # upload even when the scan fails, that's when the report matters most
      - name: Upload report to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif

  deploy:
    needs: scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy
        run: |
          curl -fsS -X POST \
            "${{ secrets.RENDER_DEPLOY_HOOK }}&imgURL=${{ env.IMAGE }}:${{ github.sha }}"

  smoke-test:
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Render keeps the old version up until the new one is ready, so poll until info shows this commit
      - name: Wait for the new version to be live
        run: |
          for attempt in $(seq 1 40); do
            commit=$(curl -fsS --max-time 20 "$APP_URL/actuator/info" | jq -r '.build.commit // empty' || true)
            status=$(curl -fsS --max-time 20 "$APP_URL/actuator/health" | jq -r '.status // empty' || true)
            echo "attempt $attempt: commit=${commit:-none} status=${status:-none}"
            if [ "$commit" = "$GITHUB_SHA" ] && [ "$status" = "UP" ]; then
              echo "$GITHUB_SHA is live and UP"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Render is not serving $GITHUB_SHA with status UP after 10 minutes"
          exit 1
