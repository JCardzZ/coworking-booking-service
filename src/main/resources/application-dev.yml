spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  flyway:
    enabled: true

payment:
  service:
    url: ${PAYMENT_SERVICE_URL}

security:
  jwt:
    secret: ${JWT_SECRET}
  admin:
    email: ${ADMIN_EMAIL}
    password: ${ADMIN_PASSWORD}
