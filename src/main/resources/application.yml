server:
  servlet:
    context-path: /coworking-service
  # public host behind a proxy
  forward-headers-strategy: framework

spring:
  application:
    name: coworking-booking-service
  config:
    # build.version and build.time for the startup banner
    import: optional:classpath:META-INF/build-info.properties
  profiles:
    active: dev
  task:
    execution:
      thread-name-prefix: async-
      pool:
        core-size: 2
        max-size: 4
        queue-capacity: 100
      # let pending notifications finish on shutdown
      shutdown:
        await-termination: true
        await-termination-period: 10s
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

security:
  jwt:
    expiration: 1h
  admin:
    full-name: Administrador

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, circuitbreakers, retries
  endpoint:
    health:
      # status is public; component details (db, disk) only for ADMIN
      show-details: when-authorized
      roles: ADMIN
  health:
    circuitbreakers:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Microservicio de gestión de reservas de espacios de coworking

payment:
  service:
    # a slow payment provider must not hold the request: fail fast and let the circuit breaker decide
    connect-timeout: 1s
    read-timeout: 2s

resilience4j:
  circuitbreaker:
    instances:
      payment:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        slow-call-duration-threshold: 2s
        slow-call-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        register-health-indicator: true
        # an open circuit is shown in health details but must not mark the app DOWN (Render would restart it)
        allow-health-indicator-to-fail: false
  retry:
    instances:
      payment:
        # one extra try, only for 5xx: a timeout already cost 2s and retrying it would make the user wait twice
        max-attempts: 2
        wait-duration: 300ms
        retry-exceptions:
          - org.springframework.web.client.HttpServerErrorException

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "
  # startup noise from libraries; their warnings and errors still show
  level:
    org.hibernate: WARN
    org.springframework.orm.jpa: WARN
    org.springframework.data.repository.config: WARN
    org.springframework.data.jpa.repository.query.QueryEnhancerFactory: WARN
    org.springframework.cloud.context.scope.GenericScope: WARN
    org.springframework.boot.web.servlet.context: WARN
    org.apache.catalina: WARN
    org.springframework.web.servlet.DispatcherServlet: WARN
    com.zaxxer.hikari.pool.HikariPool: WARN
    org.flywaydb.core.FlywayExecutor: WARN
    org.flywaydb.core.internal.command.DbValidate: WARN

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    # keep the JWT after a page reload and open "Try it out" by default
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
