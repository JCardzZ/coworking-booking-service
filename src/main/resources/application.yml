server:
  servlet:
    context-path: /coworking-service
  # public host behind a proxy
  forward-headers-strategy: framework

spring:
  application:
    name: coworking-booking-service
  config:
    # build.version and build.time for the startup banner
    import: optional:classpath:META-INF/build-info.properties
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    web:
      pageable:
        max-page-size: 100

security:
  jwt:
    expiration: 1h
  admin:
    full-name: Administrador

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics
  endpoint:
    health:
      # status is public; component details (db, disk) only for ADMIN
      show-details: when-authorized
      roles: ADMIN
  info:
    env:
      enabled: true
    java:
      enabled: true

info:
  app:
    name: ${spring.application.name}
    description: Microservicio de gestión de reservas de espacios de coworking

logging:
  pattern:
    correlation: "[%X{correlationId:-}] "

springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method
    # keep the JWT after a page reload and open "Try it out" by default
    persist-authorization: true
    try-it-out-enabled: true
    display-request-duration: true
